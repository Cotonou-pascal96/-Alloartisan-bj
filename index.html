<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlloArtisan Bj - Artisans du Bénin</title>
<style>
body{font-family:sans-serif;margin:0;background:#fff8f0}
header{background:#ff6a00;color:white;padding:20px;text-align:center}
.card{background:white;margin:15px;padding:15px;border-radius:15px;box-shadow:0 2px 10px #ddd}
button{background:#ff6a00;color:white;border:none;padding:15px 25px;border-radius:30px;width:100%;font-size:18px;font-weight:bold}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}
</style>
</head>
<body>
<header>
<h1>🛠️ AlloArtisan Bj</h1>
<p>Trouve un artisan près de toi à Abomey-Calavi</p>
</header>

<div class="card">
<h2>Maçon - 5.000 FCFA</h2>
<p>Intervention rapide à Abomey-Calavi</p>
<label>Ton numéro MoMo / Moov</label>
<input id="phone" placeholder="Ex: 97 00 00 00" type="tel">
<label>Ton adresse</label>
<input id="adresse" placeholder="Ex: Zogbadjè, Calavi">
<button onclick="payer(5000)">Payer 5.000F avec MoMo</button>
</div>

<div class="card">
<h2>Menuisier - 10.000 FCFA</h2>
<p>Fabrication et réparation</p>
<button onclick="payer(10000)">Payer 10.000F avec MoMo</button>
</div>

<script src="https://cdn.fedapay.com/checkout.js"></script>
<script>
function payer(montant){
  let tel = document.getElementById('phone').value;
  if(!tel){ alert('Mets ton numéro MoMo d\'abord Boss'); return; }
  
  FedaPay.init({
    public_key: 'pk_sandbox_OgVxU4c6rOvI7Sk6CPT2nvo4',
    transaction: {
      amount: montant,
      description: 'Commande AlloArtisan - ' + document.getElementById('adresse').value
    },
    customer: {
      firstname: 'Client',
      lastname: 'AlloArtisan',
      email: 'client@alloartisan.bj',
      phone_number: { number: tel, country: 'BJ' }
    }
  }).open();
}
</script>

</body>
</html>
