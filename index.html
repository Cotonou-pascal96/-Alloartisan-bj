<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlloArtisan Bj</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;margin:0}
header{background:#ff6a00;color:#fff;padding:22px;text-align:center}
.box{background:#fff;margin:14px;padding:18px;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
button{background:#ff6a00;color:#fff;border:0;padding:15px;width:100%;border-radius:12px;font-weight:bold;font-size:17px;margin-top:10px}
input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:7px 0;box-sizing:border-box}
.info{background:#f0fdf4;border:1px solid #bbf7d0;padding:12px;border-radius:12px;font-size:14px;margin-top:10px;text-align:center}
</style>
</head>
<body>
<header><h1>AlloArtisan Bj 🔧</h1><p>Paiement sécurisé de votre artisan</p></header>

<div class="box">
<h3>Payer mon artisan</h3>
<input id="nom" placeholder="Votre nom">
<input id="tel" placeholder="Votre numéro MoMo" type="tel">
<select id="metier">
<option value="">-- Quel artisan ? --</option>
<option>Maçon</option><option>Menuisier</option><option>Plombier</option>
<option>Électricien</option><option>Peintre</option><option>Soudeur</option>
<option>Carreleur</option><option>Charpentier</option><option>Clim / Frigoriste</option>
<option>Mécanicien Moto</option><option>Mécanicien Auto</option>
<option>Tailleur</option><option>Coiffeur</option><option>Photographe</option>
<option>Chauffeur</option><option>Jardinier</option><option>Déménageur</option>
<option>Vide Fosse</option><option>Électroménager</option><option>Autre</option>
</select>
<input id="montant" type="number" placeholder="Montant convenu (ex: 15000)" oninput="calculer()">

<div class="info" id="calcul">Entrez le montant convenu avec l'artisan</div>

<button onclick="payer()">PAYER MAINTENANT</button>
<small style="display:block;text-align:center;margin-top:8px">Paiement 100% sécurisé par FedaPay</small>
</div>

<script src="https://cdn.fedapay.com/checkout.js"></script>
<script>
function calculer(){
 let m = parseInt(document.getElementById('montant').value) || 0;
 if(m < 500){ document.getElementById('calcul').innerHTML = "Montant minimum 500F"; return; }
 // ICI ON CACHE LA COMMISSION - CLIENT VOIT SEULEMENT LE TOTAL
 document.getElementById('calcul').innerHTML = `Montant total à payer : <b>${m} F</b> ✅<br><span style="font-size:12px;color:#666">Frais AlloArtisan inclus</span>`;
}
function payer(){
 let montant = parseInt(document.getElementById('montant').value);
 let metier = document.getElementById('metier').value;
 let tel = document.getElementById('tel').value.replace(/\s/g,'');
 let nom = document.getElementById('nom').value;
 if(!montant || !metier || tel.length < 8 || !nom){ alert('Remplis tout'); return; }
 FedaPay.init({
   public_key: 'pk_sandbox_OgVxU4c6rOvI7Sk6CPT2nvo4',
   transaction: { amount: montant, description: `AlloArtisan - ${metier} - ${nom}` },
   customer: { firstname: nom, lastname: metier, email: 'client@alloartisan.bj', phone_number: { number: tel, country: 'BJ' } }
 }).open();
}
</script>
</body>
</html>
